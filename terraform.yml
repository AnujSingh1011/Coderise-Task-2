###############################################################################
# GitHub Actions – Terraform CI/CD
#
# Triggers:
#   • Push / PR to main on changes under eks/ or .github/workflows/
#   • Manual via workflow_dispatch
#
# Required GitHub Secrets:
#   AWS_ROLE_ARN          – IAM role ARN to assume via OIDC (preferred)
#   AWS_ACCESS_KEY_ID     – Fallback: static access key (use OIDC instead)
#   AWS_SECRET_ACCESS_KEY – Fallback: static secret key
###############################################################################

name: "Terraform CI/CD"

on:
  push:
    branches:
      - main
    paths:
      - "eks/**"
      - ".github/workflows/terraform.yml"
  pull_request:
    branches:
      - main
    paths:
      - "eks/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment (dev / staging / prod)"
        required: true
        default: "dev"
        type: choice
        options: [dev, staging, prod]

env:
  TF_VERSION:      "1.8.4"
  WORKING_DIR:     "./eks"
  AWS_REGION:      "us-east-1"
  TF_VAR_FILE:     "${{ github.event.inputs.environment || 'dev' }}.tfvars"

permissions:
  id-token:       write   # Required for OIDC token
  contents:       read
  pull-requests:  write   # Allows the workflow to post plan output to PRs

jobs:
  # ── terraform-checks ──────────────────────────────────────────────────────
  terraform-checks:
    name: "Lint & Validate"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── AWS Auth (OIDC – preferred, no long-lived keys) ──────────────────
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume:    ${{ secrets.AWS_ROLE_ARN }}
          aws-region:        ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-TerraformCI

      # ── Terraform setup ──────────────────────────────────────────────────
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # ── terraform init ───────────────────────────────────────────────────
      - name: Terraform Init
        id: init
        run: |
          terraform init \
            -input=false \
            -reconfigure
        env:
          TF_CLI_ARGS_init: "-backend-config=bucket=${{ secrets.TF_STATE_BUCKET }} -backend-config=dynamodb_table=${{ secrets.TF_LOCK_TABLE }}"

      # ── terraform fmt ────────────────────────────────────────────────────
      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive -diff
        continue-on-error: false

      # ── terraform validate ───────────────────────────────────────────────
      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      # ── Post fmt/validate result to PR ───────────────────────────────────
      - name: Post check results to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `### Terraform Lint & Validate

            | Step | Result |
            |------|--------|
            | 🖌 Format  | \`${{ steps.fmt.outcome }}\`      |
            | ⚙️ Init    | \`${{ steps.init.outcome }}\`     |
            | ✅ Validate | \`${{ steps.validate.outcome }}\` |

            <details><summary>Validate Output</summary>

            \`\`\`
            ${{ steps.validate.outputs.stdout }}
            \`\`\`
            </details>

            *Workflow: \`${{ github.workflow }}\` • Run: \`${{ github.run_id }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

  # ── terraform-plan ────────────────────────────────────────────────────────
  terraform-plan:
    name: "Plan"
    runs-on: ubuntu-latest
    needs: terraform-checks
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume:    ${{ secrets.AWS_ROLE_ARN }}
          aws-region:        ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-TerraformPlan

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init -input=false -reconfigure
        env:
          TF_CLI_ARGS_init: "-backend-config=bucket=${{ secrets.TF_STATE_BUCKET }} -backend-config=dynamodb_table=${{ secrets.TF_LOCK_TABLE }}"

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
            -var-file="${{ env.TF_VAR_FILE }}" \
            -input=false \
            -no-color \
            -out=tfplan 2>&1 | tee plan_output.txt
        continue-on-error: true

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ github.run_id }}
          path: |
            ${{ env.WORKING_DIR }}/tfplan
            ${{ env.WORKING_DIR }}/plan_output.txt
          retention-days: 5

      - name: Post plan output to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const planOutput = fs.readFileSync('${{ env.WORKING_DIR }}/plan_output.txt', 'utf8');
            const maxLen = 65000;
            const truncated = planOutput.length > maxLen
              ? planOutput.slice(0, maxLen) + '\n\n... (output truncated)'
              : planOutput;

            const body = `### Terraform Plan – \`${{ env.TF_VAR_FILE }}\`

            \`\`\`hcl
            ${truncated}
            \`\`\`

            *Plan outcome: \`${{ steps.plan.outcome }}\` • Run: \`${{ github.run_id }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      - name: Fail if plan errored
        if: steps.plan.outcome == 'failure'
        run: exit 1

  # ── terraform-apply (main branch only) ────────────────────────────────────
  terraform-apply:
    name: "Apply (main only)"
    runs-on: ubuntu-latest
    needs: terraform-plan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: ${{ github.event.inputs.environment || 'dev' }}
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume:    ${{ secrets.AWS_ROLE_ARN }}
          aws-region:        ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-TerraformApply

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init -input=false -reconfigure
        env:
          TF_CLI_ARGS_init: "-backend-config=bucket=${{ secrets.TF_STATE_BUCKET }} -backend-config=dynamodb_table=${{ secrets.TF_LOCK_TABLE }}"

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ github.run_id }}
          path: ${{ env.WORKING_DIR }}

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve tfplan
